<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - ShopEasy</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ================= HEADER ================= -->
    <header class="header">

        <div class="logo">
            <h1>ShopEasy</h1>
        </div>

        <nav class="navbar">

            <a href="index.html">Home</a>

            <a href="products.html">
                Products
            </a>

            <a href="categories.html">
                Categories
            </a>

            <a href="cart.html">
                🛒 Cart
            </a>

            <a href="login.html">
                Login
            </a>

        </nav>

    </header>


    <!-- ================= REGISTER PAGE ================= -->
    <main class="auth-page">

        <section class="register-container">

            <div class="register-header">

                <h2>Create Your Account</h2>

                <p>
                    Register with ShopEasy and start shopping.
                </p>

            </div>


            <!-- ================= REGISTER FORM ================= -->
            <form id="registerForm">

                <!-- Full Name -->
                <div class="form-group">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Mobile -->
                <div class="form-group">

                    <label for="mobile">
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        id="mobile"
                        name="mobile"
                        placeholder="Enter your mobile number"
                        maxlength="10"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- Confirm Password -->
                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- Terms -->
                <div class="terms">

                    <label>

                        <input
                            type="checkbox"
                            id="terms"
                            required
                        >

                        I agree to the
                        <a href="#">
                            Terms & Conditions
                        </a>

                    </label>

                </div>


                <!-- Register Button -->
                <button
                    type="submit"
                    class="register-btn"
                >
                    Create Account
                </button>

            </form>


            <!-- Login Link -->
            <div class="login-link">

                <p>

                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>

                </p>

            </div>

        </section>

    </main>


    <!-- ================= FOOTER ================= -->
    <footer class="footer">

        <div class="footer-content">

            <h2>ShopEasy</h2>

            <p>
                Your simple online shopping destination.
            </p>

            <div class="footer-links">

                <a href="about.html">
                    About Us
                </a>

                <a href="products.html">
                    Products
                </a>

                <a href="orders.html">
                    My Orders
                </a>

                <a href="tracking.html">
                    Track Order
                </a>

            </div>

        </div>

        <p class="copyright">
            © 2026 ShopEasy. All Rights Reserved.
        </p>

    </footer>


    <!-- ================= JAVASCRIPT ================= -->
    <script src="js/app.js"></script>
    <script src="js/register.js"></script>

</body>
</html>
