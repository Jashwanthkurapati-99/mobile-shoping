<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout - ShopEasy</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ================= HEADER ================= -->
    <header class="header">

        <div class="logo">
            <h1>ShopEasy</h1>
        </div>

        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="categories.html">Categories</a>
            <a href="cart.html">🛒 Cart</a>
        </nav>

    </header>


    <!-- ================= CHECKOUT ================= -->
    <main class="checkout-page">

        <h2>Checkout</h2>

        <div class="checkout-container">

            <!-- ================= DELIVERY DETAILS ================= -->
            <section class="delivery-section">

                <h3>Delivery Address</h3>

                <form id="checkoutForm">

                    <div class="form-group">
                        <label for="fullName">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="fullName"
                            name="fullName"
                            placeholder="Enter your full name"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="mobile">
                            Mobile Number
                        </label>

                        <input
                            type="tel"
                            id="mobile"
                            name="mobile"
                            placeholder="Enter your mobile number"
                            maxlength="10"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="address">
                            Address
                        </label>

                        <textarea
                            id="address"
                            name="address"
                            rows="4"
                            placeholder="House No, Street, Area"
                            required
                        ></textarea>
                    </div>


                    <div class="form-row">

                        <div class="form-group">
                            <label for="city">
                                City
                            </label>

                            <input
                                type="text"
                                id="city"
                                name="city"
                                placeholder="Enter city"
                                required
                            >
                        </div>


                        <div class="form-group">
                            <label for="state">
                                State
                            </label>

                            <input
                                type="text"
                                id="state"
                                name="state"
                                placeholder="Enter state"
                                required
                            >
                        </div>

                    </div>


                    <div class="form-group">

                        <label for="pincode">
                            PIN Code
                        </label>

                        <input
                            type="text"
                            id="pincode"
                            name="pincode"
                            placeholder="Enter PIN code"
                            maxlength="6"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="checkout-btn"
                    >
                        Continue to Payment
                    </button>

                </form>

            </section>


            <!-- ================= ORDER SUMMARY ================= -->
            <section class="order-summary">

                <h3>Order Summary</h3>

                <div id="checkoutItems">

                    <!-- Cart products will be loaded here using JavaScript -->

                </div>


                <div class="summary-row">

                    <span>Subtotal</span>

                    <span id="checkoutSubtotal">
                        ₹0
                    </span>

                </div>


                <div class="summary-row">

                    <span>Delivery</span>

                    <span id="checkoutDelivery">
                        ₹0
                    </span>

                </div>


                <hr>


                <div class="summary-row total">

                    <strong>Total</strong>

                    <strong id="checkoutTotal">
                        ₹0
                    </strong>

                </div>

            </section>

        </div>

    </main>


    <!-- ================= FOOTER ================= -->
    <footer class="footer">

        <div class="footer-content">

            <h2>ShopEasy</h2>

            <p>
                Your simple online shopping destination.
            </p>

            <div class="footer-links">

                <a href="about.html">
                    About Us
                </a>

                <a href="products.html">
                    Products
                </a>

                <a href="orders.html">
                    My Orders
                </a>

                <a href="tracking.html">
                    Track Order
                </a>

            </div>

        </div>

        <p class="copyright">
            © 2026 ShopEasy. All Rights Reserved.
        </p>

    </footer>


    <!-- ================= JAVASCRIPT ================= -->
    <script src="js/app.js"></script>
    <script src="js/checkout.js"></script>

</body>
</html>
